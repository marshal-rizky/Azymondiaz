name: NotesApp
options:
  bundleIdPrefix: dev.user
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
targets:
  NotesApp:
    type: application
    platform: iOS
    sources:
      - path: NotesApp
    resources:
      - path: NotesApp/Resources/Assets.xcassets
      - path: NotesApp/Resources/prompts
        type: folder
        optional: true
    preBuildScripts:
      - name: "Bake server prompts into bundle"
        path: Scripts/copy-prompts.sh
        basedOnDependencyAnalysis: false
    info:
      path: NotesApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Notes
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        NSMicrophoneUsageDescription: "Used for voice input to AI chat."
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: NotesApp/Resources/NotesApp.entitlements
    dependencies:
      - package: GRDB
      - sdk: PhotosUI.framework
      - sdk: PDFKit.framework
  NotesAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotesAppTests
    dependencies:
      - target: NotesApp
