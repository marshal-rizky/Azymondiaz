name: Build iPA
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          # Dynamically pick the first available iPad simulator so the job
          # doesn't break when a specific runtime isn't cached on the runner.
          SIM_ID=$(xcrun simctl list devices available -j | \
            python3 -c "
import json, sys
devs = json.load(sys.stdin)['devices']
for rt, ds in devs.items():
    for d in ds:
        if 'iPad' in d['name'] and d.get('isAvailable', False):
            print(d['udid']); sys.exit(0)
sys.exit(1)")
          xcodebuild test \
            -scheme NotesApp \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -scheme NotesApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NotesApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/NotesApp.xcarchive/Products/Applications/NotesApp.app build/Payload/
          (cd build && zip -qr NotesApp.ipa Payload)
          rm -rf build/Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NotesApp-ipa
          path: ios/build/NotesApp.ipa
          if-no-files-found: error
